<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111425">
  <title>Codex Toybox</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 10% 0%, #252b54, #111425 55%); color: #f2f3fc; }
    main { max-width: 900px; margin: auto; padding: clamp(24px, 7vw, 72px) 20px; }
    .eyebrow { color: #aaa8fa; text-transform: uppercase; letter-spacing: .17em; font-size: .75rem; font-weight: 800; }
    h1 { margin: .4rem 0 0; font-size: clamp(2.5rem, 8vw, 4.5rem); letter-spacing: -.055em; }
    .intro { max-width: 580px; font-size: 1.08rem; line-height: 1.65; color: #bcbfd7; }
    .header { margin-top: 54px; display: flex; align-items: center; gap: 12px; justify-content: space-between; }
    h2 { font-size: 1.15rem; margin: 0; }
    #count { color: #aaa8bb; font-size: .9rem; }
    #games { margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 265px), 1fr)); gap: 16px; }
    .game { background: #1c2137; border: 1px solid #363b59; border-radius: 20px; padding: 24px; color: inherit; text-decoration: none; transition: transform .16s, border-color .16s; display: flex; flex-direction: column; gap: 12px; min-height: 195px; }
    .game:hover, .game:focus-visible { border-color: #aaa8fa; transform: translateY(-3px); outline: none; }
    .emoji { font-size: 2rem; }
    .name { font-size: 1.3rem; font-weight: 800; }
    .description { color: #bcbfd7; line-height: 1.5; }
    .play { margin-top: auto; color: #b8b4ff; font-weight: 700; }
    .note { margin-top: 42px; color: #8f94b3; font-size: .9rem; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">A laboratory for terrible ideas</div>
    <h1>Codex Toybox<span aria-hidden="true"> ✨</span></h1>
    <p class="intro">One repository. As many ridiculous browser games as you can dream up. Pick a prototype and see what happens.</p>
    <div class="header"><h2>Experiments</h2><span id="count" aria-live="polite"></span></div>
    <div id="games" aria-live="polite"><p>Loading experiments…</p></div>
    <p class="note">Each experiment lives in its own folder, so one weird idea never has to overwrite another.</p>
  </main>
  <script>
    async function loadGames() {
      const container = document.getElementById('games');
      try {
        const response = await fetch('./games.json', { cache: 'no-cache' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const games = await response.json();
        if (!Array.isArray(games)) throw new Error('Invalid game list');
        container.replaceChildren();
        document.getElementById('count').textContent = `${games.length} ${games.length === 1 ? 'game' : 'games'}`;
        if (!games.length) {
          const empty = document.createElement('p'); empty.textContent = 'No games yet. Time to make something peculiar.';
          container.append(empty); return;
        }
        for (const game of games) {
          if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(game.slug)) continue;
          const card = document.createElement('a'); card.className = 'game'; card.href = `./games/${game.slug}/`;
          const emoji = document.createElement('span'); emoji.className = 'emoji'; emoji.textContent = game.emoji || '🎮';
          const title = document.createElement('span'); title.className = 'name'; title.textContent = game.title;
          const desc = document.createElement('span'); desc.className = 'description'; desc.textContent = game.description || '';
          const play = document.createElement('span'); play.className = 'play'; play.textContent = 'Play →';
          card.append(emoji, title, desc, play); container.append(card);
        }
      } catch (error) {
        container.replaceChildren();
        const message = document.createElement('p'); message.textContent = 'Could not load games. Run a local web server rather than opening index.html directly.';
        container.append(message);
        console.error(error);
      }
    }
    loadGames();
  </script>
</body>
</html>
